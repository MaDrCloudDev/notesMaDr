<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notesMaDr | MaDr</title>
    <link rel="icon" type="image/svg+xml" href="/MaDrLogo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" crossorigin src="/scripts/edit-bundle.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/views-BljzMo1P.js">
    <link rel="stylesheet" crossorigin href="/styles/views.css">
  </head>
  <body class="min-h-screen bg-black text-white">
    <div class="max-w-4xl mx-auto px-6 py-8">
      <header class="text-center mb-12">
        <h1 class="text-6xl font-bold text-[#328eef] mb-3 tracking-tight">
          <a href="/" class="hover:opacity-80 transition-opacity">notesMaDr</a>
        </h1>
        <h2 class="text-xl text-[#fffb00] font-medium">
          Take notes. Never forget.
        </h2>
      </header>

      <main>
        <form class="space-y-6">
          <div
            class="bg-gray-900/50 backdrop-blur-sm rounded-xl p-6 border border-gray-800 space-y-6"
          >
            <div>
              <input
                id="note-title"
                class="w-full bg-gray-800/60 border border-gray-700 text-white placeholder-gray-400 rounded-lg px-4 py-3 text-xl font-medium transition-all duration-200 focus:border-[#328eef] focus:outline-none focus:ring-2 focus:ring-[#328eef]/20"
                placeholder="Note title..."
              />
            </div>

            <div>
              <textarea
                id="note-body"
                class="w-full bg-gray-800/60 border border-gray-700 text-white placeholder-gray-400 rounded-lg px-4 py-3 text-lg resize-none transition-all duration-200 focus:border-[#328eef] focus:outline-none focus:ring-2 focus:ring-[#328eef]/20"
                placeholder="Start writing your note..."
                rows="12"
              ></textarea>
            </div>
          </div>

          <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-900/30 backdrop-blur-sm rounded-xl p-6 border border-gray-800/50"
          >
            <div class="flex-1">
              <span
                id="last-edited"
                class="text-sm text-gray-400 font-medium"
              ></span>
            </div>

            <div class="flex gap-3 w-full sm:w-auto">
              <button
                id="remove-note"
                type="button"
                class="flex-1 sm:flex-none bg-red-900/20 border border-red-700/50 text-red-400 px-6 py-3 rounded-lg font-medium transition-all duration-300 hover:bg-red-900/40 hover:border-red-600 hover:text-red-300 hover:shadow-lg hover:shadow-red-500/10 active:scale-95"
              >
                Remove Note
              </button>

              <a
                class="flex-1 sm:flex-none bg-green-900/20 border border-green-700/50 text-green-400 px-6 py-3 rounded-lg font-medium text-center transition-all duration-300 hover:bg-green-900/40 hover:border-green-600 hover:text-green-300 hover:shadow-lg hover:shadow-green-500/10 active:scale-95 no-underline"
                href="/index.html"
              >
                Save Note
              </a>
            </div>
          </div>
        </form>
      </main>
    </div>

  </body>
</html>
